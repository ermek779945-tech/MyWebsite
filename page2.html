<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Интересно</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 100px auto;
            padding: 30px;
        }

        h1 {
            font-size: 45px;
        }

        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            margin-top: 30px;
        }

        button {
            margin-top: 20px;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        #fact {
            font-size: 20px;
            margin-top: 25px;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            color: #93c5fd;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎉 Ты попал на вторую страницу!</h1>

        <div class="card">

            <h2>Хочешь интересный факт?</h2>

            <p id="fact">
                Нажми кнопку, и сайт выберет случайный факт.
            </p>

            <button onclick="showFact()">
                Показать факт
            </button>

        </div>

        <a href="index.html">← Вернуться на главную</a>

    </div>

    <script>
        function showFact() {

            let facts = [
                "Первый веб-сайт появился в 1991 году.",
                "HTML — это язык разметки, а не язык программирования.",
                "JavaScript позволяет веб-страницам реагировать на действия пользователя.",
                "Ты сейчас буквально создаёшь свой первый сайт.",
                "Один сайт может состоять из десятков и даже тысяч страниц."
            ];

            let randomNumber = Math.floor(Math.random() * facts.length);

            document.getElementById("fact").textContent = facts[randomNumber];
        }
    </script>

</body>

</html>
